name: probe-data-sources
on:
  workflow_dispatch:
  push:
    paths: ["collector/probe.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests finance-datareader pykrx
      - run: python collector/probe.py
      - uses: actions/upload-artifact@v4
        with: { name: probe-result, path: probe_result.json }
