name: funds
on:
  workflow_dispatch:
  schedule:
    - cron: "10 1 * * 1-6"    # 화~토 10:10 KST (전 영업일 기준가 공시 이후)
  push:
    paths: ["collector/funds.py", ".github/workflows/funds.yml"]
permissions:
  contents: write
concurrency: funds
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python collector/funds.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/funds.json docs/funds collector/fund_map.json
          git diff --cached --quiet || (git commit -qm "펀드 기준가 갱신 $(date -u +%F)" && git pull -q --rebase origin main && git push -q origin main)
