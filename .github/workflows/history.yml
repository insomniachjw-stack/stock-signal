name: fetch-history
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/history.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas pyarrow
      - run: python collector/fetch_history.py 1000 20130101
      - name: data 브랜치에 저장
        run: |
          mkdir out && mv prices.parquet universe.csv out/ && cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "과거 시세 데이터 갱신"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
